spring.profiles.active=prod

#PostgreSQL settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/treekeydb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#google auth settings
app.auth.google.client-id=${APP_AUTH_GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${APP_AUTH_GOOGLE_CLIENT_SECRET:}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.continue-on-error=${SPRING_INIT_CONTINUE_ON_ERROR:true}
#setting for: to run the data initialization from data.sql (resp. all other data-${platform}.sql files)
spring.sql.init.mode=never
#setting for: to run data.sql scripts AFTER the Hibernate created tables (by default is data.sql loaded before
# Hibernate created tables)
spring.jpa.defer-datasource-initialization=true
####
spring.datasource.hikari.data-source-properties.useUnicode=true
spring.datasource.hikari.data-source-properties.characterEncoding=UTF-8
#this property is default, need to check
#hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

#### TEMP settings
#-----settings for: to show sql queries + "to beautify"
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8443


