<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/user-layout.html}"
      lang="en">
<body>
<section layout:fragment="content">
    <h2>My account</h2>
    <img th:if="${account.pictureUrl != null}"
         th:src="${account.pictureUrl}"
         th:alt="${account.displayName != null ? account.displayName : 'Google profile picture'}"
         class="rounded-circle mb-3"
         width="96"
         height="96"/>
    <p th:if="${account.displayName != null}" th:text="${account.displayName}"></p>
    <p th:if="${account.email != null}" th:text="${account.email}"></p>
</section>
</body>
</html>
