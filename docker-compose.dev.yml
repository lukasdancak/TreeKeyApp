services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db-treekeyapp
    environment:
      POSTGRES_DB: my_db_name
      POSTGRES_USER: mydb_user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_treekeyapp:/var/lib/postgresql/data
    networks:
      - treekeyapp-network

  app:
    build: .
    container_name: spring-app
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/my_db_name
      - DB_USERNAME=mydb_user
      - DB_PASSWORD=password
    ports:
      - "8080:8080"
    networks:
      - treekeyapp-network

volumes:
  postgres_data_treekeyapp:

networks:
  treekeyapp-network:
    driver: bridge
